[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sigma-vi"
version = "0.1.0"
description = "SIGMA VI — agentic investment research, portfolio management, backtesting and paper trading."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
# Core runtime: the deterministic engine depends only on these.
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "pandas>=2.2",
  "pydantic>=2.7",
]

[project.optional-dependencies]
# Data + persistence layer (Phase 2)
data = [
  "polars>=1.0",
  "pyarrow>=16",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "httpx>=0.27",
  "pydantic-settings>=2.3",
  "tenacity>=8.3",
]
# Model gateway + agents (Phase 4/5/12)
ai = [
  "litellm>=1.40",
]
# Simulation acceleration (Phase 8)
sim = [
  "numba>=0.60",
]
# API for the dashboard (Phase 10)
api = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
]
# Broker (Phase 11) — paper trading only until Stage 6 sign-off
broker = [
  "alpaca-py>=0.30",
]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["N803", "N806", "N818"]  # finance symbols (FCF, EV) and descriptive exception names

[tool.ruff.lint.per-file-ignores]
"src/sigma/committee/*.py" = ["E501"]  # prose tables and long prompt strings read better unwrapped
"src/sigma/final.py" = ["E501"]  # report prose
"tests/**" = ["E501", "N812", "RUF005"]  # wide fixture rows; short module aliases (F, S) in tests

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
