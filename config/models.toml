# SIGMA VI model registry and role chains — $0 configuration.
#
# Application code asks for a ROLE; this file decides which models serve it and in what fallback
# order. Model ids are LiteLLM ids ("<provider>/<model>").
#
# Every model here costs nothing:
#   * gemini/*  — Google Gemini API free tier (verified on ai.google.dev/gemini-api/docs/pricing,
#                 2026-10-07). Rate-limited; on the free tier Google may use prompts to improve its
#                 products, so only public-company research goes here, never personal data.
#   * ollama_chat/* — open-weight models running locally through Ollama. Unlimited, private.
#
# The router runs with free_only=true by default: a model without `free = true` is never called,
# and tests/unit/test_router.py fails if a non-free model is added to any role chain. To add a paid
# provider later, add it with verified prices and run the router with free_only=false deliberately.

[models.gemini_flash]
id = "gemini/gemini-3.8-flash"
provider = "gemini"
context_window = 1000000
input_per_mtok = 0.0
output_per_mtok = 0.0
price_verified = true
free = true

[models.gemini_lite]
id = "gemini/gemini-3.5-flash-lite"
provider = "gemini"
context_window = 1000000
input_per_mtok = 0.0
output_per_mtok = 0.0
price_verified = true
free = true

# Local reasoning model: OpenAI's open-weight gpt-oss 20B (14 GB download, 128K context). It's a
# mixture-of-experts model, so it runs at usable speed on a CPU with 32 GB RAM.
[models.local_reasoning]
id = "ollama_chat/gpt-oss:20b"
provider = "ollama"
context_window = 128000
input_per_mtok = 0.0
output_per_mtok = 0.0
price_verified = true
free = true

# Local fast model for extraction, classification and summaries (about 3-4 GB).
[models.local_fast]
id = "ollama_chat/qwen3.5:4b"
provider = "ollama"
context_window = 256000
input_per_mtok = 0.0
output_per_mtok = 0.0
price_verified = true
free = true

# Ordered fallback chains. First healthy model wins. Every role ends on a local model, so research
# continues (more slowly) when Gemini's free-tier quota is used up.
[roles]
FAST      = ["local_fast", "gemini_lite", "local_reasoning"]
DATA      = ["gemini_lite", "local_reasoning"]
RESEARCH  = ["gemini_flash", "local_reasoning"]
REASONING = ["gemini_flash", "local_reasoning"]
CRITIC    = ["local_reasoning", "gemini_flash"]   # different model family from the judge and thesis author
JUDGE     = ["gemini_flash", "local_reasoning"]
CODING    = ["gemini_flash", "local_reasoning"]
FALLBACK  = ["local_reasoning", "local_fast"]
